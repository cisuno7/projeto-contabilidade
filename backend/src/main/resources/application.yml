spring:
  application:
    name: contabil-automation

  # ==========================================
  # SELEÇÃO DO AMBIENTE (DEV ou PROD)
  # Mude para 'dev' para usar H2 local
  # Mude para 'prod' para usar Supabase
  # ==========================================
  profiles:
    active: prod

---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:h2:mem:contabil_db
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # validate garante que o schema já existente está correto
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

---
# Configurações de integração com IA
ai:
  service:
    api-key: ${AI_API_KEY}
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    timeout: 30000
    model: ${AI_MODEL:gpt-4}

# Configurações de armazenamento de arquivos
# type: local (disco) | supabase (bucket no Supabase Storage)
file:
  storage:
    type: ${FILE_STORAGE_TYPE:local}
    path: ${FILE_STORAGE_PATH:./uploads}
    max-size: 10485760 # 10MB
    # Supabase Storage (usado quando type=supabase)
    supabase:
      url: ${SUPABASE_URL:}
      service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
      bucket: ${SUPABASE_STORAGE_BUCKET:planilhas}

# Configurações JWT
jwt:
  secret: ${JWT_SECRET:ablTxvM7xeNRnAop7p+7drou2uu5rqcHXzzO057GU0LV1gg7zoGRWUUyrbz135fEwkIqPWMbX/X5MyQAb/sTA==}
  expiration: ${JWT_EXPIRATION:86400000} # 24 horas em milissegundos

server:
  port: 8080
  servlet:
    context-path: /api
